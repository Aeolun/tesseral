server {
  server_name webhooks.tesseral.example.com;

  listen 443 ssl;
  ssl_certificate /etc/nginx/conf.d/webhooks.tesseral.example.com.pem;
  ssl_certificate_key /etc/nginx/conf.d/webhooks.tesseral.example.com-key.pem;

  resolver 127.0.0.11 valid=1s;

  location / {
    set $upstream http://webhook-tester:8080;
    proxy_pass $upstream;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket timeout settings
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}

